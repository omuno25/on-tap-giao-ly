version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    # Một PR gộp mỗi tháng cho các bản vá tương thích; không tự nâng major.
    open-pull-requests-limit: 1
    groups:
      bun-compatible-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      bun-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Actions được pin SHA và chỉ nhận PR khi có bản vá bảo mật.
    open-pull-requests-limit: 0
    groups:
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
